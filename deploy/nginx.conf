# ============================================================
# JAYMA — vhost nginx production
# - djayma.sn (landing + dashboard + admin)
# - *.djayma.sn (boutiques tenants)
# - TLS via Let's Encrypt wildcard
#
# Prérequis : cert wildcard déjà obtenu via DNS-01 avant le 1er start :
#   certbot certonly --manual --preferred-challenges=dns \
#     -d djayma.sn -d '*.djayma.sn' --agree-tos -m contact@djayma.sn
# ============================================================

upstream jayma_backend {
    server web:8000;
}

# Redirect HTTP → HTTPS (laisse passer /.well-known/acme-challenge pour renew)
server {
    listen 80;
    server_name djayma.sn *.djayma.sn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — djayma.sn + tous les sous-domaines
server {
    listen 443 ssl;
    http2 on;
    server_name djayma.sn *.djayma.sn;

    ssl_certificate     /etc/letsencrypt/live/djayma.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djayma.sn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 10M;  # uploads produits (images)

    # Fichiers statiques — servis par nginx directement
    location /static/ {
        alias /app/static_collected/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Médias : en local si pas sur R2. En prod avec R2, ce bloc peut être retiré.
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # Tout le reste → Django via Gunicorn
    location / {
        proxy_pass http://jayma_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}

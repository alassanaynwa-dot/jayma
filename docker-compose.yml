# ============================================================
# JAYMA — docker-compose pour environnement de dev
# Ports externes choisis pour éviter les conflits avec les
# services déjà lancés sur la machine hôte (PG 5433, Redis 6380,
# Mailpit 1025/8025, Django 8000/8001 déjà pris).
# ============================================================

services:

  db:
    image: postgres:16-alpine
    container_name: jayma_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jayma}
      POSTGRES_USER: ${POSTGRES_USER:-jayma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jayma_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jayma}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jayma_redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: jayma_mailpit
    restart: unless-stopped
    ports:
      - "1026:1025"  # SMTP
      - "8026:8025"  # UI web
    environment:
      MP_MAX_MESSAGES: 5000

  web:
    build: .
    container_name: jayma_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: jayma_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: jayma_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: jayma_nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static_collected:/app/static:ro
      - media_data:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  media_data:

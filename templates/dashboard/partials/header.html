{# Header dashboard #}
<header class="h-16 bg-white border-b border-slate-200 px-4 sm:px-6 lg:px-8 flex items-center justify-between sticky top-0 z-30">
  <div class="flex items-center gap-3">
    <button type="button" @click="sidebarOpen = true" class="lg:hidden -ml-2 p-2 rounded-lg hover:bg-slate-100">
      <svg class="h-6 w-6 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 class="font-serif text-xl font-medium text-ink-500">{% block header_title %}Dashboard{% endblock %}</h1>
  </div>

  <div x-data="{ open: false }" class="relative">
    <button type="button" @click="open = !open" class="flex items-center gap-2 rounded-lg px-2 py-1.5 hover:bg-slate-100">
      <div class="h-8 w-8 rounded-full bg-jappesi-500 flex items-center justify-center text-white text-sm font-semibold">
        {{ request.user.first_name|slice:":1"|default:request.user.username|slice:":1"|upper }}
      </div>
      <span class="hidden sm:block text-sm font-medium text-slate-700">{{ request.user.first_name|default:request.user.username }}</span>
      <svg class="hidden sm:block h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
    </button>
    <div x-show="open" @click.outside="open = false" x-cloak x-transition class="absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border border-slate-200 py-1 z-50">
      <div class="px-4 py-2 border-b border-slate-100">
        <div class="text-sm font-medium text-ink-500">{{ request.user.get_full_name|default:request.user.username }}</div>
        <div class="text-xs text-slate-500 truncate">{{ request.user.email }}</div>
      </div>
      <a href="{% url 'accounts:password_change' %}" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">Changer mon mot de passe</a>
      <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}
        <button type="submit" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50">Se déconnecter</button>
      </form>
    </div>
  </div>
</header>

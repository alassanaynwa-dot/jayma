{% with s=status|default:order.status %}
  {% if s == "pending" %}
    <span class="inline-flex items-center gap-1.5 rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-medium text-amber-700">
      <span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>En attente</span>
  {% elif s == "confirmed" %}
    <span class="inline-flex items-center gap-1.5 rounded-full bg-jappesi-100 px-2.5 py-0.5 text-xs font-medium text-jappesi-700">
      <span class="h-1.5 w-1.5 rounded-full bg-jappesi-500"></span>Confirmée</span>
  {% elif s == "shipped" %}
    <span class="inline-flex items-center gap-1.5 rounded-full bg-sky-100 px-2.5 py-0.5 text-xs font-medium text-sky-700">
      <span class="h-1.5 w-1.5 rounded-full bg-sky-500"></span>Expédiée</span>
  {% elif s == "delivered" %}
    <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-100 px-2.5 py-0.5 text-xs font-medium text-emerald-700">
      <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>Livrée</span>
  {% elif s == "cancelled" %}
    <span class="inline-flex items-center gap-1.5 rounded-full bg-slate-200 px-2.5 py-0.5 text-xs font-medium text-slate-600">Annulée</span>
  {% elif s == "disputed" %}
    <span class="inline-flex items-center gap-1.5 rounded-full bg-red-100 px-2.5 py-0.5 text-xs font-medium text-red-700">
      <span class="h-1.5 w-1.5 rounded-full bg-red-500"></span>Litige</span>
  {% endif %}
{% endwith %}

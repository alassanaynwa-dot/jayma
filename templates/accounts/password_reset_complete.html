{% extends "accounts/_auth_shell.html" %}
{% block title %}Mot de passe changé — Jappesi{% endblock %}

{% block auth_content %}
<div class="mx-auto h-16 w-16 rounded-full bg-emerald-100 flex items-center justify-center">
  <svg class="h-8 w-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
</div>
<h1 class="mt-6 font-serif text-2xl font-medium text-ink-500">Mot de passe mis à jour</h1>
<p class="mt-3 text-sm text-slate-600">Tu peux maintenant te connecter avec ton nouveau mot de passe.</p>
<a href="{% url 'accounts:login' %}" class="btn-primary mt-6 inline-flex">Se connecter</a>
{% endblock %}

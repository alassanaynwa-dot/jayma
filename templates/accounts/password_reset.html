{% extends "accounts/_auth_shell.html" %}
{% block title %}Mot de passe oublié — Jayma{% endblock %}

{% block auth_content %}
<h1 class="font-serif text-3xl font-medium text-ink-500">Mot de passe oublié</h1>
<p class="mt-2 text-sm text-slate-600">Entre ton email : on t'envoie un lien pour réinitialiser ton mot de passe.</p>

<form method="post" class="mt-6 space-y-4">
  {% csrf_token %}
  <div>
    <label class="label">Adresse email</label>
    <input type="email" name="email" class="input" required autofocus placeholder="ton@email.sn">
  </div>
  <button type="submit" class="btn-primary w-full">Envoyer le lien</button>
</form>

<p class="mt-6 text-center text-sm">
  <a href="{% url 'accounts:login' %}" class="text-slate-500 hover:text-ink-500">← Retour à la connexion</a>
</p>
{% endblock %}

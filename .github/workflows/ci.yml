name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jayma
          POSTGRES_PASSWORD: jayma_test
          POSTGRES_DB: jayma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jayma"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-prod
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: jayma_test
      POSTGRES_USER: jayma
      POSTGRES_PASSWORD: jayma_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      JAYMA_ROOT_DOMAIN: localhost

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Django check
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run pytest
        run: pytest -v --tb=short

      - name: Ruff lint
        run: ruff check . || true  # non-bloquant pour commencer

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker compose build web
